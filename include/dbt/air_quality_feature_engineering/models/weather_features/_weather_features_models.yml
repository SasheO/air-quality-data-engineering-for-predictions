      - name: pm10_72_hour_rolling_max
        description: Maximum PM10 concentration over a centered 72-hour window (±36 hours), with a 5-minute grace period on each bound.

      - name: pm10_1_hour_delta
        description: Change in PM10 versus 1 hour ago, within a ±5-minute grace period.

      - name: pm10_3_hour_delta
        description: Change in PM10 versus 3 hours ago, within a ±5-minute grace period.

      - name: hour_of_day
        description: Hour of day extracted from time_of_measurement (0–23).

      - name: day_of_week
        description: ISO day of week extracted from time_of_measurement (1 = Monday … 7 = Sunday).

      - name: is_weekend
        description: Boolean flag; TRUE when day_of_week is Saturday or Sunday.

      - name: month_of_the_year
        description: Month extracted from time_of_measurement (1–12).

      - name: season
        description: Seasonal category derived from the city's latitude and the month.

      - name: aqi_6_hour_ahead
        description: Target variable; AQI 6 hours ahead, gap-aware within the location partition, within a ±5-minute grace period.