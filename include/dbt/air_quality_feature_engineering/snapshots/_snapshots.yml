version: 2

snapshots:
  - name: city_coordinates
    description: SCD2 snapshot of city coordinates tracking changes to city and country names.
    columns:
      - name: lat_and_long_encoding_id
        description: Surrogate key generated from latitude_coordinate and longitude_coordinate.
        data_tests:
          - not_null

      - name: latitude_coordinate
        description: Latitude coordinate of the city.
        data_tests:
          - not_null

      - name: longitude_coordinate
        description: Longitude coordinate of the city.
        data_tests:
          - not_null

      - name: city
        description: Name of the city.

      - name: country
        description: Country of the city.

      - name: dbt_scd_id
        description: Unique identifier for each snapshot row generated by dbt.
        data_tests:
          - unique
          - not_null

      - name: dbt_updated_at
        description: Timestamp when the snapshot row was last updated.

      - name: dbt_valid_from
        description: Timestamp from which the snapshot row is valid.
        data_tests:
          - not_null

      - name: dbt_valid_to
        description: Timestamp until which the snapshot row is valid; NULL for the current row.